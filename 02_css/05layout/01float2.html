<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *{
      margin: 0;
      padding: 0;
    }

    h1,
    .container,
    p {
      width: 1280px;
      border: 1px solid #ccc;
      margin: 0 auto;
      box-sizing: border-box;
    }

    .container{
      overflow: hidden;

      /* 
      1. 같은 레벨일 경우 오버 플로우 어쩌고
      2. 부모와 자식, 겹쳐서 튕길 때 오버 플로우 히든으로 내리기.

      both: 양 옆으로 내리기???? / hidden:음..??
      */
    }

    .container div{ /* 이게 뭔소리인지 해석이 안되네 ;; */
      width: 150px;
      height: 50px;
      background: blue;
    }

    .container .left{
      float: left;
    }
    .container .right{
      float: right;
    }
  </style>
  <title>float</title>
</head>
<body>
  <h1>clear 속성을 이용한 위치 조정</h1>
  <div class="container">
    <div class="left">왼쪽 끝에 위치하고 싶은 요소</div>
    <div class="right">오른쪽 끝에 위치하고 싶은 요소</div>
  </div>
  <p>이 글자를 아래쪽에 제대로 출력 하고 싶어요</p>
</body>

</html>
