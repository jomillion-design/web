  <meta charset="UTF-8">

  <title>scale</title>
  <style>
    *{margin: 00; padding: 0;}

    ul{
      list-style: none;
      width: 640px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
    }

    ul li{
      width: 200px;
      height: 150px;
      overflow: hidden;
    }
    ul li a{
      display: block;
      width: 100%;
      height: 100%;
    }

    ul li a img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: .6s;
    }

    ul li:hover a img{
      transform: scale(1.2);
    }
    
  </style>
