<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카드뒤집기</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    .con {
      width: 300px;
      height: 300px;
      background: #ccc;
      position: relative;
      margin: 400px auto;
    }
    
    .con .card {
      width: 100%;
      height: 100%;
      position: absolute;
      left: 0;
      top: 0;
      transition: .6s;
      transform-style: preserve-3d; /* 자식이 3D 속성을 가져야 할 때 넣는 속성 */
      transform-origin: top center; /* 기준점 잡는 속성 */

      
    }

    .con:hover .card {
      transform: rotateX(180deg); /* ?? */
    }

    .face {
      position: absolute;
      width: 100%;
      height: 100%;
      left: 0;
      top: 0;
      backface-visibility: hidden;/* 뒷면 카드 돌려 안보이게 해놓은거 */
    }

    .face img { 
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* transform: rotateZ(-180deg); */ 
    }

    .back {
       transform: rotatex(180deg); 
    }
  </style>
</head>

<body>
  <div class="con">
    <div class="card">
      <div class="face front"><img
          src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRplbSYG-F4i3WO5za5tRF3SXlhmACmhY4Z17RCy_Wr323lFwxas3zWRI2i&s=10"
          alt="변우석앞면"></div>
      <div class="face back"><img
          src="https://www.esquirekorea.co.kr/resources/online/online_image/2025/04/30/275aa371-b718-4f3c-8ea1-ebe5800c9a35.png"
          alt="변우석뒷면"></div>
    </div><!-- //.card -->
  </div><!-- //.con -->
</body>

</html>
