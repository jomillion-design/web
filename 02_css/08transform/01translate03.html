<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>translate</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }

    div {
      width: 600px;
      height: 400px;
      margin: 100px auto;
      border: 1px solid black;
      position: relative;
      perspective: 1600px;
    }

    div p {
      width: 100%;
      height: 100%;
      background: blue;
      opacity: 3;
      color: #fff;
      font-size: 60px;
      position: absolute;
      left: 0;
      top: 0;
      transition: 0.5s;
    }

    div:hover p:nth-child(1){transform: translateZ(-500px);}
    div:hover p:nth-child(2){transform: translate(0);}

    div:hover p:nth-child(3){
      transform: translate(500px);
    }
  </style>
</head>

<body>
  <div>
    <p>box1</p>
    <p>box2</p>
    <p>box3</p>
  </div>
</body>

</html>
