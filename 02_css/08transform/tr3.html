<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>transition</title>
  <style>
    #btn {
      width: 100px;
      height: 50px;
    }

    .tr1 {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 1px solid #000;
      background: red;
      position: absolute;
      left: 50%;
      top: 50%;

      /* on으로 불렀을 때 로테이트 해야됨, 그래서 마진으로 넣음 */

      margin-left: -50px;
      margin-top: -50px;
      transition: 2s 2s linear;  /* 듀레이션:전체 시간 / 딜레이:n초동안 */
    }

    .tr1.on {
      /* tr1자체에 on클래스를 줄거라 붙임 */

      width: 200px;
      height: 200px;
      background: salmon;
      border: 3px solid ghostwhite;
      border-radius: 0;
      transform: rotate(270deg);
      /* 얘가 겹치는 거라서 마진으로 준겨 */
    }
  </style>
</head>

<body>
  <button type="button" id="btn">바꾸자</button>
  <div class="tr1">

  </div>

  <script>
    document.getElementById('btn').addEventListener('click',()=>{
      document.querySelector('.tr1').classList.toggle('on');
    })
  </script>
</body>

</html>
