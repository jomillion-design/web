<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>transition</title>
  <style>
    h1{
      text-align: center;
      font-size: 52px;
    }

    .tr1{
      width: 100px;
      height: 100px;
      background: red; /* d여기는 백그라운드인데 */
      border: 1px solid #000;
      transition-property: background-color,transform,height,width;
      transition-duration: 2s,3s,4s,5s;
      transition-delay: 1s;
    }

    .tr1:hover{
      width: 200px;
      height: 200px;
      background-color: aqua; /* 여긴 왜 컬러로 해도 먹음요? */
      transform: rotate(180deg);
    }
  </style>
</head>
<body>
  <div class="tr1">
    <h1>!</h1>
  </div>
</body>
</html>
