<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>animation</title>
  <style>
    .box {
      width: 100px;
      height: 100px;
      background: blue;
      animation-name: changeBg;
      animation-duration: 3s;
      animation-iteration-count: 3; /* 몇번 발복할 건지 정함 */
      animation-direction: alternate; /* 자연스럽게 반복 */
    }

    @keyframes changeBg {
      from {
        background: blue;
      }

      to {
        background: red;
        border: 1px solid yellow;
        border-radius: 50%;
      }


    }
  </style>
</head>

<body>
  <div class="box"></div>
</body>

</html>
