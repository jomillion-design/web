<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>box-sizing</title>
    <style>
        div {
            width: 320px;
            height: 200px;
            border: 20px solid rebeccapurple;
            margin: 10px;
            padding: 40px;
        }

        .box1 {
            background: orange;
            width: 400px;
            height: 100px;
        }

        .box2 {
            box-sizing: content-box;
        }

        .box3 {
            box-sizing: border-box;
        } /* 보통 얘로 레이아웃 짜는 게 편하다는 데 뭔지 모름. 왜그런지 잘 몰름.  */

        .box4 {
            width: 200px;
            height: 200px;
            padding: 15px;
            border: 3px dashed #ccc;
            box-sizing: border-box; /* 얘를 왜 넣어야하는건데 ㅈㅂ */
        }
    </style>
</head>

<body>
    <div class="box1">box-sizing = '기본값'</div>
    <div class="box2">box-sizing = 'content-box'</div>
    <div class="box3">box-sizing = 'border-box'</div>
    <div class="box4">가로사이즈 200px 세로사이즈 200px padding 15px border: 3px dashed #ccc</div>
</body>

</html>
