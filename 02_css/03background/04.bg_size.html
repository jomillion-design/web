<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배경 사이즈</title>
  <style>
    div {
      background-image: url(./img/1295.png);
      width: 500px;
      height: 400px;
      border: 2px dotted red;
      background-repeat: no-repeat;
      margin-bottom: 20px;
    }

    .bg1{
      background-size: auto;
      /* 기본값: 이미지 원본 사이즈 */
    }
    .bg2{
      background-size: 200px 150px;
    }
    .bg3{
      background-size: 60% 40%;
    }
    .bg4{ /* 얘는 로고 (잘리면 안되는 것들!) 같이 중요한 것들에 씀 */
      background-size: contain;
    }
    .bg5{  /* 일반적으로 커버는 배경 느낌.  */
      background-size: cover;
      background-position: center; 
    }
    .bg6{
      background-size: 100% 100%;
    }
  </style>
</head>
<body>
  <div class="bg1"></div>
  <div class="bg2"></div>
  <div class="bg3"></div>
  <div class="bg4"></div>
  <div class="bg5"></div>
  <div class="bg6"></div>
</body>
</html>
