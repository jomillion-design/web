<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            width: 500px;
            height: 500px;
            margin: 10px;
        }

        .gr1 {
            background: linear-gradient(135deg, #ff8a1e 0%, #ffe2a6 100%);
        }

        .gr2 {
            background-color: #8b5cf6;
            background-image:
                radial-gradient(circle at 18% 28%, color-mix(in oklch, #fb7185 84%, white) 0 18%, transparent 42%),
                radial-gradient(circle at 76% 18%, color-mix(in oklch, #8b5cf6 76%, white) 0 15%, transparent 38%),
                radial-gradient(circle at 78% 78%, color-mix(in oklch, #fb7185 42%, #8b5cf6) 0 20%, transparent 44%),
                conic-gradient(from 148deg at 46% 52%, color-mix(in oklch, #fb7185 42%, white), color-mix(in oklch, #8b5cf6 70%, black), color-mix(in oklch, #fb7185 64%, #8b5cf6), color-mix(in oklch, #fb7185 42%, white));
            background-blend-mode: screen, normal, overlay, normal;
        }


        .gr3 {
            background:
                linear-gradient(128deg, rgba(255, 255, 255, .5), transparent 24%, rgba(255, 255, 255, .22) 58%, transparent 78%),
                conic-gradient(from 128deg at 50% 52%, #22d3ee, #a78bfa, #f97316, #22c55e, #22d3ee);
            background-blend-mode: screen, normal;
        }

        .gr4 {
            background-color: #111827;
            background-image:
                linear-gradient(124deg, rgba(255, 255, 255, .88) 0 8%, transparent 18% 28%, rgba(255, 255, 255, .42) 34% 42%, transparent 54% 64%, rgba(255, 255, 255, .78) 72%, transparent 84%),
                conic-gradient(from 124deg at 52% 48%, color-mix(in oklch, #d1d5db 82%, white), #67e8f9, color-mix(in oklch, #111827 92%, black), #f8fafc, #d1d5db),
                repeating-linear-gradient(132deg, rgba(255, 255, 255, .18) 0 1px, transparent 1px 5px),
                linear-gradient(214deg, color-mix(in oklch, #111827 88%, black), color-mix(in oklch, #d1d5db 44%, white) 50%, color-mix(in oklch, #111827 86%, black));
            background-blend-mode: screen, color-dodge, overlay, normal;
        }

        .gr5 {
            background:
                radial-gradient(circle at 0% 0%, color-mix(in oklch, #7c3aed 72%, white) 0 18%, transparent 42%),
                radial-gradient(circle at 100% 12%, #06b6d4 0 16%, transparent 42%),
                linear-gradient(145deg, color-mix(in oklch, #7c3aed 8%, white), color-mix(in oklch, #06b6d4 18%, black));
        }

        .gr6 {
            background-color: #f8fafc;
            background-image:
                radial-gradient(circle at 50% 22%, rgba(255, 255, 255, .78) 0 10%, transparent 34%),
                radial-gradient(circle at 18% 28%, #f97316 0 16%, transparent 44%),
                radial-gradient(circle at 82% 76%, #38bdf8 0 18%, transparent 48%),
                linear-gradient(90deg, color-mix(in oklch, #f97316 24%, transparent) 1px, transparent 1px),
                linear-gradient(0deg, color-mix(in oklch, #f97316 18%, transparent) 1px, transparent 1px),
                linear-gradient(124deg, color-mix(in oklch, #f8fafc 90%, white), color-mix(in oklch, #0f172a 20%, #f8fafc));
            background-size: 100% 100%, 100% 100%, 100% 100%, 22px 22px, 22px 22px, 100% 100%;
            background-blend-mode: screen, screen, lighten, overlay, overlay, normal;
        }
    </style>
</head>

<body>
    <div class="gr gr1"></div>
    <div class="gr gr2"></div>
    <div class="gr gr3"></div>
    <div class="gr gr4"></div>
    <div class="gr gr5"></div>
    <div class="gr gr6"></div>
</body>

</html>
