<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>align-item</title>
  <link rel="stylesheet" href="default.css">
  <style>
    .flex_container {
      display: flex;
      width: 800px;
      height: 300px;

      /* 자!! 
      align -교차축 정렬!!
      justify- 주축 정렬!!!
      
      */

      align-items: stretch; /* !!기본 값: 아이템들이 교차축 방향으로 쭈욱 늘어남!! */
      align-items: flex-end; /* 아이템들이 교차축 끝점으로 정렬 */
      align-items: center;/* 아이템의 교차축 가운데 정렬 */
      align-items: flex-start; /* 아이템 교차축 시작점 연결 */
      align-items: baseline; /* 문자 기준선을 맞춰 배치함 (폰트 크기가 다를 떄 ) */
    }
    .flex_item:nth-child(1){font-size: 30px;}
    .flex_item:nth-child(2){font-size: 12px;}
    .flex_item:nth-child(3){font-size: 50px; align-self: center;}
    .parent{
      margin-top: 50px;
      justify-content: center;
      align-items: center;
    }
  </style>

</head>

<body>
  <div class="flex_container">
    <div class="flex_item">aaaaaaaaaaa</div>
    <div class="flex_item">bbbbbbbbbb</div>
    <div class="flex_item">cccccccccc</div>
  </div>
  <div class="flex_container parent">
    <div class="flex_item">cccccccccc</div>
  </div>
</body>

</html>
