<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>flex-basis</title>
  <link rel="stylesheet" href="default.css">
  <style>
    .flex_container{
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .flex_item{
      width: 100px;
      flex-basis: auto;
      flex-basis: 200px; /* 왜 배우는지는 뒤에서 나음. / ?? */
    }
  </style>

</head>

<body>
  <div class="flex_container">
    <div class="flex_item">aaaaaaaaaaa</div>
    <div class="flex_item">bbbbbbbbbb</div>
    <div class="flex_item">cccccccccc</div>
  </div>
</body>

</html>
