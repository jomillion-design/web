<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>justify-content</title>
  <link rel="stylesheet" href="default.css">
  <style>
    .flex_container{
      display: flex; /* 얘의 엄마가 또 디스플레이 플렉스를 쓸 수 잇남 */
      width: 80%;
      margin: 0 auto;
      justify-content: flex-start; /* 아이템들을 시작점으로 정렬 */
      justify-content:flex-end; /* 아이템들을 끝점으로 정렬 */
      justify-content: center; /* 아이템들을 가운데로 정렬 */
      justify-content: space-between; /* 아이템 사이를 균일 간격으로 정렬 */
      justify-content: space-around; /* 아이템 둘레의 균일 간격 정렬 */
      justify-content: space-evenly;/* 아이템 사이와 양끝 균일 간격 */
      justify-content: center;
      gap: 20px;
    }
  </style>

</head>

<body>
  <div class="flex_container">
    <div class="flex_item">aaaaaaaaaaa</div>
    <div class="flex_item">bbbbbbbbbb</div>
    <div class="flex_item">cccccccccc</div>
  </div>
</body>

</html>
