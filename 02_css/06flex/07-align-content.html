<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>align-content</title>
  <link rel="stylesheet" href="default.css">
  <style>

    /* 두 줄 이상일 때의 교차축 정렬 */

    .flex_container{
      display: flex;
      flex-wrap: wrap;
      width: 500px;
      height: 500px;
      align-content: stretch; /* 기본 */
      align-content: start;
      align-content: flex-end;
      align-content: center;
      align-content: space-between;
      align-content: space-around;
      align-content: space-evenly;
    }
  </style>
</head>

<body>
  <div class="flex_container">
    <div class="flex_item">AAAAAAAAAAAA</div>
    <div class="flex_item">BBB</div>
    <div class="flex_item">CCCCCCCCC</div>
    <div class="flex_item">DDDDDDDDDDDDDDDDDDDDDDD</div>
    <div class="flex_item">EEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEEE</div>
  </div>
</body>

</html>
