<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가상요소</title>
  <style>
    ul {
      list-style: none;
      display: flex;
      gap: 50px;
    }

    ul li {
      width: 100px;
      height: 50px;
      line-height: 50px;

      background: lavender;
      position: relative;
      box-sizing: border-box;
      padding-left: 10px;
    }

    ul li::before{
      /* 비폴과 애프터한테는 content가 꼭 있어야함 */
      content: '';
      display: block;
      width: 5px;
      height: 5px;
      background: pink;
      border-radius: 50%;
      position: absolute;
      left: 0; top: 22px;
    }

    ul li:last-child::after{
      content: 'new';
      color: rgb(153, 51, 51);
      font-size: 0.8rem;
      background: #000;
      margin-left: 10px;
      
    }

    ul li a{
      text-decoration: none;
    }
  </style>
</head>

<body>
  <ul>
    <li><a href="#">메뉴1</a></li>
    <li><a href="#">메뉴2</a></li>
    <li><a href="#">메뉴3</a></li>
    <li><a href="#">메뉴4</a></li>
  </ul>
</body>

</html>
