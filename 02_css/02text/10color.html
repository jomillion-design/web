<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>color 속석</title>
  <style>
    body {
      background: lightcoral;
    }

    .hax {
      color: #ddd
    }

    .rgb {
      color: rgba(46, 54, 81, 1);
      color: (220, 150, 103);
    }

    /* 보통 헥스코드로 씀(범용성) */

    .hsl {
      color: hsl(226, 28%, 25%);
    }

    .col {
      color: wheat;
    }

    div {
      width: 100px;
      height: 50px;
      background-color: rgba(46, 54, 81, 1, 0.5);
      /* opacity: 0.5; 0.5=.5 같음*/
    }
  </style>
</head>

<body>
  <h1>color 속성</h1>
  <ul>
    <li>글자색 지정</li>
    <li>
      <span class="hax">16진수 값(HAX 코드), </span>
      <span class="rgb">RGB 값 , </span>
      <span class="hsl">HSL 값 , </span>
      <span class="col">색상 이름</span>
    </li>
  </ul>
  <div>rgba</div>
</body>

</html>
