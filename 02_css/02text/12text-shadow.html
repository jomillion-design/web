<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>text-shadowl</title>
  <style>
    .ex {
      margin-top: 100px;
      border: 1px solid #ccc;
    }

    .s1 {
      font-size: 50px;
      text-shadow: 10px 10px 3px #f00;
    }

    .s2 {
      font-size: 100px;
      color: orange;
      text-shadow: -2px -2px 3px blue;
    }


    .s3 {
      text-align: center;
      font-size: 24pt;
      text-decoration: underline dotted #6A86E2 2.5pt;
      text-shadow: 30pt -10pt 20px #6A86E2;
    }

    .s4 {
      background-color: rgb(198, 222, 214, 0.8);
      margin: 20%;
      padding: 20%;
      text-align: center;
      color: rgb(150, 82, 47);
      text-shadow: 2px 0 2px  ;
    }

  </style>
</head>

<body>
  <h1>text-shadow 속성</h1>
  <p>텍스트에 그림자 효과를 추가하는 속성</p>
  <p>text-shadow : 가로거리 세로거리 번짐정도 색상</p>
  <div class="ex">
    <h2 class="s1">HTML5</h2>
    <h2 class="s2">HTML5</h2>
    <h2 class="s3">HTML5</h2>
    <h2 class="s4">HTML5</h2>
    <h2 class="s5">HTML5</h2>
  </div>
</body>

</html>
