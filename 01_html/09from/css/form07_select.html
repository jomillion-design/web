<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=`, initial-scale=1.0">
  <title>select 태그</title>
</head>

<body>
  <h1>여름 방학 특강 신청</h1>
  <form>
    <fieldset>
      <legend>수강 신청인</legend>
      <ul>
        <li><label>학번<input type="number" autofocus></label></li>

        <li>
          <label for="uname"></label>
          <input type="text" id="uname">
        </li>

        <li>
          <label for="class">학과</label>
          <select id="class" size="3" multiple> <!-- 최대 몇개 까지 보이게? 사이즈 / 멀티플 : 복수선택 -->
            <option value="a1">건축공학과1</option>
            <option value="a2">건축공학과1</option>
            <option value="a3" selected>건축공학과1</option> <!-- 셀렉티드 > 기본 선택값 -->
            <option value="a4">건축공학과1</option>
            <option value="a5">건축공학과1</option>
            <option value="a6">건축공학과1</option>
          </select>
        </li>

        <li>
          <label for="class2">학과</label>
          <select id="class2">
            <optgroup label="공과대학">
              <option value="b1">기계공학과1</option>
              <option value="b2">기계공학과2</option>
              <option value="b3">기계공학과3</option>
              <option value="b4">기계공학과4</option>
            </optgroup>

            <optgroup label="인문대학">
              <option value="c1">사학과</option>
              <option value="c2" selected>어문학부</option>
              <option value="c3">철학과</option>
            </optgroup>
          </select>
        </li>
      </ul>
    </fieldset>
  </form>
</body>

</html>
