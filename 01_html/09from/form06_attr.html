<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>input 태그 속성</title>
  <style>
    em {
      color: red;
    }
  </style>
</head>

<body>
  <form>
    <ul>
      <li>
        <label for="uid">이름</label>
        <input type="text" id="uid" autofocus>
        <!-- autofocus : 페이지를 불러오자마자 원하는 폼 요소에 마우스 커서 표시-->
      </li>

      <li>
        <!-- placeholder : 입력란에 표시하는 힌트로 필드를 클릭하면 사라짐 -->
        <label for="subj">학번</label>
        <input type="number" id="subj" placeholder="하이픈 없이 입력" min="0">
        <!-- id 뺴먹음!! 꼭 넣어서 하도록. -->
      </li>

      <li>
        <!-- readonly : 내용을 보기만 하고 입력하지 못하게 함.-->
        <lebel for="read">읽기만 함</lebel>
        <input type="text" id="read" readonly value="못쳐요">
        <!-- id 설정 안함! -->
      </li>

      <li>
        <labels for="uname"><small><em>*</em></small>닉네임</labels>
        <input type="text" id="uname" required>
        <!-- required : 필수 필드 체크 -->
      </li>

      <li>
        <!-- 이거 둘 다 같은 방법이라 ㄱㅊ -->
        <button type="submit">전송</button>
        <input type="submit" value="전송">
      </li>
    </ul>
  </form>
</body>

</html>
