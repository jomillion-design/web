<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iframe</title>
</head>

<!-- 
iframe과 a 태그의 차이는 
 iframe은 현재 문서 내에 다른 문서를 포함시킬 때 사용되고, 
 a 태그는 다른 페이지로 이동할 때 사용된다. 
-->

<body>
    <div class="container">
       <h2>iframe 태그를 이용해 외부문서(사이트) 포함 시키기</h2>
       <iframe src="https://www.naver.com/" frameborder="0"></iframe>
       <iframe src="https://www.bokbootlab.com/" frameborder="0" width="500" height="500"></iframe>
       <iframe width="560" height="315" src="https://www.youtube.com/embed/DIPxnt5vnhU?si=RYnesYZ__U6WStMh" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>
    <iframe src="../00first/second.html" frameborder="0" width="1280" height="500"></iframe>
</body>
</html>
