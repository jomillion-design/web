<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>태그</title>
  <style>
    * {
      margin: 0;
      padding: 0;
    }
    .inner{
      width: 1280px;
      height: 100px;
      background: pink;
      margin-inline: auto;
    }
    /* css에서 앞에 . <이 붙는 것들은 "class"의 속성을 받은 것들 */
    main{
      width: 100%;
      height: 500px;
      background: red;
    }
  </style>
</head>
<body>
  <header></header>
  <div class="inner"></div>
  <main>
    <div class="inner"></div>
  </main>
  <footer>
    <div class="inner"></div>
  </footer>
</body>
</html>
