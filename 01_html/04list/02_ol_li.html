<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>순서 목록</title>
</head>
<body>
  <ol>
    <li>첫번째</li>
    <li>두번째</li>
    <li>세번째</li>
  </ol>
  
  <section>
    <h2> 커피 드립 순서 - 알파벳 역순</h2> <!-- h1은 로고에만 사용 -->
    <ol type="A" reversed>
       <!-- 앞에 무슨 기호 붙이는지 변경하는 거 / 자동 완성 안 나올 땐 ctlr + space -->
        <!-- reversed 속성 반전 -->
      <li>필터접기</li>
      <li>분쇄</li>
      <li>불림</li>
      <li>추출</li>
    </ol>
  </section>

  <section>
    <h2> 커피 드립 순서 - 아라비안 숫자 3부터</h2> 
    <ol start="3" type="I">
      <li>필터접기</li>
      <li>분쇄</li>
      <li>불림</li>
      <li>추출</li>
    </ol>
  </section>
</body>
</html>
