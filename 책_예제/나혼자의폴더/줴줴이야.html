<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>재민이와 복습</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    header {
      background-color: aquamarine;
      color: bisque;
      padding: 20px;
    }

    nav {
      display: flex;
      gap: 15px;
      margin-top: 10px;
    }
  </style>
</head>

<body>
  <header>
    <h2>재민이와의 공부</h2>
    <nav>
      <div><a href="#" target="_blank" rel="noopener noreferrer"> 소개 </a></div>
      <div><a href="#" target="_blank" rel="noopener noreferrer"> 프로필 </a></div>
    </nav>
  </header>
  
  <main>
    <section>
      <h3>자기소개 섹션</h3> <!-- 섹션 제목 -->
      <p>Lorem, ipsum dolor sit amet consectetur adipisicing elit. Velit laboriosam porro quidem...</p>
      
      <figure>
        <img src="profile.jpg" alt="프로필 사진">
        <figcaption>이것은 사진 설명(figcaption)입니다!</figcaption> <!-- figure 설명글 -->
      </figure>

      <hr>

      <form>
        <fieldset> 
          <legend>로그인 정보</legend> <!-- 상자의 간판(제목) -->
          <label>아이디</label>
          <input type="text" placeholder="아이디를 입력하세요"> <!-- 힌트 보여주는 placeholder -->
        </fieldset>
      </form>
    </section>
  </main>

  <footer>
    재민아 고마워 내 최선이야 
  </footer>
</body>

</html>
