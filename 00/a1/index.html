<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Just 쇼핑몰</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<!-- 1. 바디 안에 wrap 클래스 
2. 세로 값 주지 말기 (걍 기본 100)
3.A 헤더 B디브 암거나 C 세션 태그 > 아티클 D푸터 -->

<!-- 소문자 대문자 섞어 X 소문자만
    id는 개발자들이 많이 쓰는거니까 
    클래스를 id처럼 쓰자.
-->

<!-- 그리고 클래스를 쓸 때 사람들이 보통 무슨 단어로 클래스를 쓰는지 알아보자!! -->


<body>
  <div id="wrap">
    <header>
      <h1><a href="#">로고</a></h1>
      <nav>
        <ul>
          <li id="m1"><a href="#">메뉴1</a></li>
          <li id="m2"><a href="#">메뉴2</a></li>
          <li id="m3"><a href="#">메뉴3</a></li>
          <li id="m4"><a href="#">메뉴4</a></li>
        </ul>
      </nav>
    </header>

    <div id="B"> <!-- 개발자들이 id들이 많이 써서 클래스로 -->
      <p>이미지</p>
    </div>

    <section id="C">
      <article class="c_1">
        <h2>공지 사항</h2>
      </article>
      <article class="c_3">
        <h3>배너</h3>
      </article>
      <article class="c_4">
        C4번입니다
      </article>
    </section>

    <footer>
      <div class="f_logo ff">
        <a href="#">
          로고
        </a>
      </div>
      <div class="f_text ff"> Simple is Best </div>
      <div class="f_SNS ff">
        <p>sns</p>
      </div>
    </footer>
</body>

</html>
