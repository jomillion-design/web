<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>숫자(number) 데이터</title>
  
<!-- 별로 쓸 일은 없다만 알고는 있자 -->

</head>
<body>
  <script>
    //number 데이터는 저웃, 소수점, 지수를 표현할 수 있다
    let num1 = 10;
    console.log(num1);
    let num2 = 10.5;
    console.log(num2);
    let num3 = 2e+2; //2*(10의 2승) = 2*100
    console.log(num3);
  </script>
</body>
</html>
